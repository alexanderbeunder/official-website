    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let scene, camera, renderer, controls;
        // Multiplayer: add your Supabase project URL and publishable/anon key here.
        // These are intended for browser use; protect the project with the SQL policies below.
        const SUPABASE_URL = 'https://lijoylwdgdumscovodap.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xGvKjtmtv7qiGV5ErTkiAA_H6a4icrM';
        const MULTIPLAYER_CHANNEL = 'threejs-exhibition-lobby';

        let supabaseClient = null;
        let multiplayerChannel = null;
        let multiplayerReady = false;
        let visitorId = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'visitor-' + Math.random().toString(36).slice(2);
        let visitorName = (window.prompt('Welcome to the exhibition! What name should other visitors see?') || '').trim().slice(0, 24);
        if (!visitorName) visitorName = 'Guest ' + visitorId.slice(0, 4);
        const remoteVisitors = new Map();
        let lastPositionBroadcast = 0;

        // Proximity voice chat: audio is sent peer-to-peer with WebRTC.
        const VOICE_HEAR_DISTANCE = 50;
        const VOICE_DISCONNECT_DISTANCE = 60;
        const voicePeers = new Map();
        let localMicrophoneStream = null;
        let voiceAudioContext = null;
        let footstepAudioContext = null;
        let nextLocalFootstepAt = 0;
        const nextRemoteFootstepAt = new Map();

        function getFootstepAudioContext() {
            if (!footstepAudioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                footstepAudioContext = new AudioContextClass();
            }
            if (footstepAudioContext.state === 'suspended') {
                footstepAudioContext.resume().catch(() => {});
            }
            return footstepAudioContext;
        }

        function playFootstep(volume = 0.12, pitch = 1) {
            const ctx = getFootstepAudioContext();
            if (!ctx || volume < 0.008) return;
            const now = ctx.currentTime;

            // Short filtered noise gives a soft shoe-on-floor sound.
            const length = Math.floor(ctx.sampleRate * 0.11);
            const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
                const fade = Math.pow(1 - i / length, 2.2);
                data[i] = (Math.random() * 2 - 1) * fade;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(850 * pitch, now);
            filter.frequency.exponentialRampToValueAtTime(260 * pitch, now + 0.1);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(Math.max(0.0001, volume), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 0.12);

            // Very quiet low thump adds a little body without sounding like a drum.
            const thump = ctx.createOscillator();
            const thumpGain = ctx.createGain();
            thump.type = 'sine';
            thump.frequency.setValueAtTime(105 * pitch, now);
            thump.frequency.exponentialRampToValueAtTime(58 * pitch, now + 0.075);
            thumpGain.gain.setValueAtTime(volume * 0.22, now);
            thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
            thump.connect(thumpGain);
            thumpGain.connect(ctx.destination);
            thump.start(now);
            thump.stop(now + 0.085);
        }

        let voiceEnabled = false;
        let voiceStatusTimer = null;

        function setVoiceStatus(message) {
            const status = document.getElementById('voiceStatus');
            if (status) status.textContent = message;
        }

        function sendVoiceSignal(peerId, payload) {
            if (!multiplayerChannel || !multiplayerReady) return;
            multiplayerChannel.send({
                type: 'broadcast',
                event: 'voice-signal',
                payload: { from: visitorId, to: peerId, ...payload }
            });
        }

        function setupIncomingVoiceAnalyser(peer) {
            if (!peer || !peer.remoteStream || !voiceAudioContext) return;
            try {
                if (voiceAudioContext.state === 'suspended') {
                    voiceAudioContext.resume().catch(() => {});
                }

                if (peer.analyserSource) {
                    try { peer.analyserSource.disconnect(); } catch (error) {}
                }
                if (peer.analyser) {
                    try { peer.analyser.disconnect(); } catch (error) {}
                }
                if (peer.analyserKeepAlive) {
                    try { peer.analyserKeepAlive.disconnect(); } catch (error) {}
                }

                peer.analyser = voiceAudioContext.createAnalyser();
                peer.analyser.fftSize = 1024;
                peer.analyser.smoothingTimeConstant = 0.25;
                peer.analyserData = new Uint8Array(peer.analyser.fftSize);
                peer.analyserSource = voiceAudioContext.createMediaStreamSource(peer.remoteStream);
                peer.analyserKeepAlive = voiceAudioContext.createGain();
                peer.analyserKeepAlive.gain.value = 0;

                // Keep the analyser graph running without playing the stream twice.
                peer.analyserSource.connect(peer.analyser);
                peer.analyser.connect(peer.analyserKeepAlive);
                peer.analyserKeepAlive.connect(voiceAudioContext.destination);
            } catch (error) {
                console.warn('Could not set up incoming voice analyser:', error);
            }
        }

        function getPeerConnection(peerId) {
            let peer = voicePeers.get(peerId);
            if (peer) return peer;

            // Google STUN helps browsers discover their public network route.
            // A TURN relay can be added later for networks that block direct P2P.
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });
            peer = {
                pc,
                makingOffer: false,
                ignoreOffer: false,
                isSettingRemoteAnswerPending: false,
                polite: visitorId.localeCompare(peerId) > 0,
                audio: null,
                remoteStream: null,
                analyser: null,
                analyserSource: null,
                analyserData: null,
                analyserKeepAlive: null,
                // ICE candidates can arrive before the remote description.
                pendingCandidates: [],
                disconnectTimer: null
            };
            voicePeers.set(peerId, peer);

            if (localMicrophoneStream) {
                localMicrophoneStream.getAudioTracks().forEach(track => pc.addTrack(track, localMicrophoneStream));
            }

            pc.onicecandidate = event => {
                if (event.candidate) sendVoiceSignal(peerId, { candidate: event.candidate });
            };

            pc.ontrack = event => {
                let audio = peer.audio;
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.playsInline = true;
                    audio.dataset.voicePeer = peerId;
                    audio.style.display = 'none';
                    document.body.appendChild(audio);
                    peer.audio = audio;
                }
                const stream = event.streams && event.streams[0];
                if (stream) {
                    peer.remoteStream = stream;
                    audio.srcObject = stream;
                    setupIncomingVoiceAnalyser(peer);
                }
                audio.play().catch(() => setVoiceStatus('Click the page to allow audio playback'));
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;

                if (state === 'connected') {
                    if (peer.disconnectTimer) {
                        clearTimeout(peer.disconnectTimer);
                        peer.disconnectTimer = null;
                    }
                    return;
                }

                if (state === 'failed' || state === 'closed') {
                    closeVoicePeer(peerId);
                    return;
                }

                // "disconnected" is often temporary (especially on mobile/Wi-Fi).
                // Give ICE a few seconds to recover before rebuilding the peer.
                if (state === 'disconnected' && !peer.disconnectTimer) {
                    peer.disconnectTimer = setTimeout(() => {
                        peer.disconnectTimer = null;
                        if (pc.connectionState === 'disconnected' ||
                            pc.connectionState === 'failed') {
                            closeVoicePeer(peerId);
                            // updateProximityVoice() will create a fresh peer if
                            // the visitor is still nearby and the mic is enabled.
                            updateProximityVoice();
                        }
                    }, 8000);
                }
            };

            pc.onnegotiationneeded = async () => {
                try {
                    peer.makingOffer = true;
                    await pc.setLocalDescription();
                    sendVoiceSignal(peerId, { description: pc.localDescription });
                } catch (error) {
                    console.warn('Voice negotiation failed:', error);
                } finally {
                    peer.makingOffer = false;
                }
            };

            return peer;
        }

        async function handleVoiceSignal(message) {
            if (!message || message.to !== visitorId || !message.from) return;
            const peerId = message.from;
            const peer = getPeerConnection(peerId);
            const pc = peer.pc;

            try {
                if (message.description) {
                    const description = message.description;
                    const readyForOffer = !peer.makingOffer &&
                        (pc.signalingState === 'stable' || peer.isSettingRemoteAnswerPending);
                    const offerCollision = description.type === 'offer' && !readyForOffer;
                    peer.ignoreOffer = !peer.polite && offerCollision;
                    if (peer.ignoreOffer) return;

                    peer.isSettingRemoteAnswerPending = description.type === 'answer';
                    await pc.setRemoteDescription(description);
                    peer.isSettingRemoteAnswerPending = false;

                    // Apply candidates that arrived before setRemoteDescription completed.
                    if (peer.pendingCandidates.length) {
                        const queuedCandidates = peer.pendingCandidates.splice(0);
                        for (const candidate of queuedCandidates) {
                            try {
                                await pc.addIceCandidate(candidate);
                            } catch (error) {
                                if (!peer.ignoreOffer) {
                                    console.warn('Could not apply queued ICE candidate:', error);
                                }
                            }
                        }
                    }

                    if (description.type === 'offer') {
                        await pc.setLocalDescription();
                        sendVoiceSignal(peerId, { description: pc.localDescription });
                    }
                } else if (message.candidate) {
                    // Candidates may be broadcast before the matching offer/answer
                    // reaches this browser. Queue them instead of dropping them.
                    if (peer.ignoreOffer) return;

                    if (!pc.remoteDescription || !pc.remoteDescription.type) {
                        peer.pendingCandidates.push(message.candidate);
                    } else {
                        try {
                            await pc.addIceCandidate(message.candidate);
                        } catch (error) {
                            if (!peer.ignoreOffer) {
                                console.warn('Could not add ICE candidate:', error);
                            }
                        }
                    }
                }
            } catch (error) {
                console.warn('Voice signal error:', error, {
                    peerId,
                    signalingState: pc.signalingState,
                    connectionState: pc.connectionState,
                    hasRemoteDescription: !!pc.remoteDescription
                });
            }
        }

        function closeVoicePeer(peerId) {
            const peer = voicePeers.get(peerId);
            if (!peer) return;
            if (peer.disconnectTimer) {
                clearTimeout(peer.disconnectTimer);
                peer.disconnectTimer = null;
            }
            try { peer.pc.ontrack = null; peer.pc.close(); } catch (error) {}
            if (peer.analyserSource) {
                try { peer.analyserSource.disconnect(); } catch (error) {}
            }
            if (peer.analyser) {
                try { peer.analyser.disconnect(); } catch (error) {}
            }
            if (peer.analyserKeepAlive) {
                try { peer.analyserKeepAlive.disconnect(); } catch (error) {}
            }
            if (peer.audio) {
                peer.audio.pause();
                peer.audio.srcObject = null;
                peer.audio.remove();
            }
            voicePeers.delete(peerId);
        }

        function updateProximityVoice() {
            if (!scene || !multiplayerReady) return;
            const localPosition = controls ? controls.getObject().position : camera.position;
            let nearbyCount = 0;

            for (const [peerId, visitor] of remoteVisitors.entries()) {
                const distance = Math.hypot(localPosition.x - visitor.group.position.x, localPosition.z - visitor.group.position.z);
                const existing = voicePeers.has(peerId);

                if (distance <= VOICE_HEAR_DISTANCE) {
                    nearbyCount++;
                    if (voiceEnabled && !existing) getPeerConnection(peerId);
                } else if (distance > VOICE_DISCONNECT_DISTANCE && existing) {
                    closeVoicePeer(peerId);
                }
            }

            if (!voiceEnabled) {
                setVoiceStatus('Microphone off');
            } else if (nearbyCount === 0) {
                setVoiceStatus('Mic on · no visitors nearby');
            } else {
                setVoiceStatus('Mic on · ' + nearbyCount + ' visitor(s) nearby');
            }
        }

        async function toggleVoiceChat() {
            const button = document.getElementById('voiceToggle');
            if (voiceEnabled) {
                voiceEnabled = false;
                if (localMicrophoneStream) {
                    localMicrophoneStream.getTracks().forEach(track => track.stop());
                    localMicrophoneStream = null;
                }
                for (const [peerId, peer] of voicePeers.entries()) {
                    peer.pc.getSenders().forEach(sender => {
                        if (sender.track) sender.replaceTrack(null).catch(() => {});
                    });
                }
                button.textContent = '🎙 Enable microphone';
                button.setAttribute('aria-pressed', 'false');
                setVoiceStatus('Microphone off');
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setVoiceStatus('Microphone requires HTTPS and a supported browser');
                return;
            }
            try {
                setVoiceStatus('Requesting microphone permission…');
                localMicrophoneStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        // Automatic gain can raise quiet speaker bleed and trigger false mouth movement.
                        autoGainControl: true,
                        channelCount: 1
                    },
                    video: false
                });

                // Start/resume the analyser context from this explicit button click.
                // Desktop browsers may otherwise leave an AudioContext created later
                // inside the WebRTC ontrack callback suspended.
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    if (!voiceAudioContext) voiceAudioContext = new AudioContextClass();
                    if (voiceAudioContext.state === 'suspended') {
                        await voiceAudioContext.resume();
                    }
                    for (const peer of voicePeers.values()) {
                        if (peer.remoteStream) setupIncomingVoiceAnalyser(peer);
                    }
                }

                // A tap/click is also a user gesture: retry playback for peers whose
                // browser previously blocked autoplay.
                for (const peer of voicePeers.values()) {
                    if (peer.audio) {
                        peer.audio.play().catch(() => {
                            setVoiceStatus('Audio playback blocked · tap the page or check device sound');
                        });
                    }
                }

                voiceEnabled = true;
                button.textContent = '🔇 Mute microphone';
                button.setAttribute('aria-pressed', 'true');

                // Add the newly enabled microphone to existing nearby connections.
                for (const [peerId, peer] of voicePeers.entries()) {
                    const audioTrack = localMicrophoneStream.getAudioTracks()[0];
                    const sender = peer.pc.getSenders().find(item => !item.track || item.track.kind === 'audio');
                    if (sender) await sender.replaceTrack(audioTrack);
                    else peer.pc.addTrack(audioTrack, localMicrophoneStream);
                }
                updateProximityVoice();
            } catch (error) {
                console.error('Microphone access failed:', error);
                setVoiceStatus(error.name === 'NotAllowedError'
                    ? 'Microphone permission denied'
                    : 'Could not access microphone');
            }
        }

        function setupVoiceChat() {
            const button = document.getElementById('voiceToggle');
            if (button) button.addEventListener('click', toggleVoiceChat);
            setVoiceStatus('Microphone off · enable to talk');
            setInterval(updateProximityVoice, 300);
            window.addEventListener('beforeunload', () => {
                for (const peerId of voicePeers.keys()) closeVoicePeer(peerId);
                if (localMicrophoneStream) localMicrophoneStream.getTracks().forEach(track => track.stop());
            });
        }

        function makeNameSprite(name, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 44px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 8;
            ctx.strokeStyle = 'rgba(0,0,0,0.72)';
            ctx.strokeText(name, 256, 64);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(name, 256, 64);
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: texture, transparent: true, depthTest: false
            }));
            sprite.scale.set(2.8, 0.7, 1);
            return sprite;
        }

        // Visitors are lightweight procedural stick figures (no external GIF needed).
        // Their local feet are exactly at y=0; the whole figure sits on the room floor.
        const AVATAR_FLOOR_Y = -7.49;

        function makeStickLine(group, color, points, width = 3) {
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color, linewidth: width });
            const line = new THREE.Line(geometry, material);
            group.add(line);
            return line;
        }

        function setStickLine(line, points) {
            const attr = line.geometry.attributes.position;
            points.forEach((p, i) => attr.setXYZ(i, p.x, p.y, p.z));
            attr.needsUpdate = true;
            line.geometry.computeBoundingSphere();
        }

        function createRemoteVisitor(id, name) {
            if (remoteVisitors.has(id)) return remoteVisitors.get(id);
            const hue = Math.abs([...id].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) * 37) % 360;
            const color = new THREE.Color('hsl(' + hue + ', 72%, 38%)');
            const group = new THREE.Group();

            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.16, 12, 10),
                new THREE.MeshBasicMaterial({ color })
            );
            head.position.set(0, 1.62, 0);
            group.add(head);

            // Small contrasting eyes on the front of the head (local -Z),
            // matching the camera's forward direction.
            const eyeWhiteMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pupilMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeGeometry = new THREE.SphereGeometry(0.035, 8, 6);
            const pupilGeometry = new THREE.SphereGeometry(0.018, 8, 6);
            [-1, 1].forEach(side => {
                const eye = new THREE.Mesh(eyeGeometry, eyeWhiteMaterial);
                eye.position.set(side * 0.065, 1.665, -0.145);
                group.add(eye);

                const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
                pupil.position.set(side * 0.065, 1.665, -0.176);
                group.add(pupil);
            });

            // Mouth opens and closes according to the incoming voice audio level.
            const mouth = new THREE.Mesh(
                new THREE.SphereGeometry(0.045, 10, 8),
                new THREE.MeshBasicMaterial({ color: 0x171717 })
            );

        function updateRemoteVisitor(payload) {
            if (!payload || payload.id === visitorId ||
                !Number.isFinite(payload.x) || !Number.isFinite(payload.z)) return;
            const visitor = createRemoteVisitor(payload.id, payload.name);
            visitor.isMobile = payload.isMobile === true;
            const oldX = visitor.group.position.x;
            const oldZ = visitor.group.position.z;
            visitor.group.position.x = payload.x;
            visitor.group.position.z = payload.z;
            // The avatar is scaled so its head aligns with a visitor's normal eye height
            // when standing on the floor (camera eye level y=2.5).
            // Offset the whole figure by the visitor's change in height.
            if (Number.isFinite(payload.y)) {
                visitor.group.position.y = AVATAR_FLOOR_Y + (payload.y - 2.5);
            }

            if (visitor.lastX !== null) {
                const moved = Math.hypot(payload.x - visitor.lastX, payload.z - visitor.lastZ);
                visitor.walking = moved > 0.025;
            }
            // The eyes face local -Z. The broadcast yaw is derived from the camera's
            // world-facing vector, so desktop pointer-lock and mobile rotation use one convention.
            if (Number.isFinite(payload.rotation)) {
                visitor.group.rotation.y = payload.rotation;
            }
            visitor.lastX = payload.x;
            visitor.lastZ = payload.z;

            if (payload.name && visitor.name !== payload.name) {
                visitor.label.material.map.dispose();
                visitor.label.material.map = makeNameSprite(payload.name).material.map;
                visitor.name = payload.name;
            }
        }

        function animateRemoteVisitors(deltaSeconds) {
            const now = performance.now() * 0.001;
            for (const [peerId, visitor] of remoteVisitors.entries()) {
                const voicePeer = voicePeers.get(peerId);
                let level = 0;
                if (
                    voicePeer &&
                    voicePeer.analyser &&
                    voicePeer.analyserData
                ) {
                    // This analyser belongs only to the incoming stream from this peer.
                    voicePeer.analyser.getByteTimeDomainData(voicePeer.analyserData);
                    let sumSquares = 0;
                    for (let i = 0; i < voicePeer.analyserData.length; i++) {
                        const sample = (voicePeer.analyserData[i] - 128) / 128;
                        sumSquares += sample * sample;
                    }
                    level = Math.sqrt(sumSquares / voicePeer.analyserData.length);
                }
                // A slightly higher gate helps prevent quiet room/speaker bleed from
                // making a silent visitor appear to be talking.
                // Desktop microphone levels can be quieter than mobile levels.
                // Use a lower gate and stronger response for desktop visitors only.
                const speechThreshold = visitor.isMobile ? 0.025 : 0.008;
                const mouthSensitivity = visitor.isMobile ? 22 : 38;
                const targetMouthOpen = level > speechThreshold
                    ? Math.min(1.8, 0.18 + (level - speechThreshold) * mouthSensitivity)
                    : 0.18;
                visitor.audioLevel += (targetMouthOpen - visitor.audioLevel) * Math.min(1, deltaSeconds * 14);
                visitor.mouth.scale.y = visitor.audioLevel;

                if (visitor.walking) {
                    visitor.walkPhase += deltaSeconds * 9;
                    const dx = visitor.group.position.x - getLocalPlayerPosition().x;
                    const dz = visitor.group.position.z - getLocalPlayerPosition().z;
                    const distance = Math.hypot(dx, dz);
                    const audibleRange = 70;
                    if (distance < audibleRange && now >= visitor.nextFootstepAt) {
                        const distanceGain = Math.pow(1 - distance / audibleRange, 1.35);
                        playFootstep(0.095 * distanceGain, 0.92 + (visitor.walkPhase % 1) * 0.12);
                        visitor.nextFootstepAt = now + 0.48;
                    }
                } else {
                    visitor.walkPhase *= 0.85;
                }

                const swing = visitor.walking ? Math.sin(visitor.walkPhase) * 0.28 : 0;
                const armSwing = visitor.walking ? Math.sin(visitor.walkPhase + Math.PI) * 0.22 : 0;
                setStickLine(visitor.leftLeg, [
                    new THREE.Vector3(0, 0.72, 0),
                    new THREE.Vector3(-0.16 + swing, 0.36, 0),
                    new THREE.Vector3(-0.16 + swing * 1.35, 0, 0)
                ]);
                setStickLine(visitor.rightLeg, [
                    new THREE.Vector3(0, 0.72, 0),
                    new THREE.Vector3(0.16 - swing, 0.36, 0),
                    new THREE.Vector3(0.16 - swing * 1.35, 0, 0)
                ]);
                setStickLine(visitor.leftArm, [
                    new THREE.Vector3(0, 1.28, 0),
                    new THREE.Vector3(-0.18 + armSwing, 1.02, 0),
                    new THREE.Vector3(-0.28 + armSwing, 0.82, 0)
                ]);
                setStickLine(visitor.rightArm, [
                    new THREE.Vector3(0, 1.28, 0),
                    new THREE.Vector3(0.18 - armSwing, 1.02, 0),
                    new THREE.Vector3(0.28 - armSwing, 0.82, 0)
                ]);
            }
        }

        function getCotopaxiGroundHeight(x, z) {
            const r = Math.hypot(x - COTOPAXI_X, z - COTOPAXI_Z);
            if (r >= COTOPAXI_BASE_RADIUS) return COTOPAXI_FLOOR_Y;
            const profile = [[30,-7.49],[24,0],[18,10],[12,22],[8,34],[5,43],[3,47],[0,42]];
            for (let i = 0; i < profile.length - 1; i++) {
                const [ro, ho] = profile[i], [ri, hi] = profile[i + 1];
                if (r <= ro && r >= ri) return ho + (hi - ho) * ((ro - r) / (ro - ri));
            }
            return 42;
        }

        function setupMultiplayer() {
            if (!window.supabase || SUPABASE_URL.startsWith('YOUR_') ||
                SUPABASE_ANON_KEY.startsWith('YOUR_')) {
                console.info('Multiplayer is ready to configure: add your Supabase project URL and anon/publishable key.');
                return;
            }

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            multiplayerChannel = supabaseClient.channel(MULTIPLAYER_CHANNEL, {
                config: { presence: { key: visitorId }, broadcast: { self: false } }
            });

            multiplayerChannel
                .on('presence', { event: 'sync' }, () => {
                    const active = multiplayerChannel.presenceState();
                    const presentIds = new Set();
                    Object.entries(active).forEach(([id, entries]) => {
                        if (id === visitorId) return;
                        const data = entries && entries[0];
                        if (!data) return;
                        presentIds.add(id);
                        updateRemoteVisitor({
                            id,
                            name: data.name,
                            x: Number.isFinite(data.x) ? data.x : 0,
                            y: Number.isFinite(data.y) ? data.y : 2.5,
                            z: Number.isFinite(data.z) ? data.z : 0,
                            rotation: Number.isFinite(data.rotation) ? data.rotation : 0,
                            isMobile: data.isMobile === true
                        });
                    });
                    for (const id of remoteVisitors.keys()) {
                        if (!presentIds.has(id)) removeRemoteVisitor(id);
                    }
                })
                .on('presence', { event: 'join' }, ({ key, newPresences }) => {
                    if (key === visitorId) return;
                    (newPresences || []).forEach(data => updateRemoteVisitor({
                        id: key, name: data.name, x: data.x, y: data.y, z: data.z, rotation: data.rotation, isMobile: data.isMobile === true
                    }));
                })
                .on('presence', { event: 'leave' }, ({ key }) => removeRemoteVisitor(key))
                .on('broadcast', { event: 'position' }, ({ payload }) => updateRemoteVisitor(payload))
                .on('broadcast', { event: 'voice-signal' }, ({ payload }) => handleVoiceSignal(payload))
                .subscribe(async status => {
                    if (status === 'SUBSCRIBED') {
                        multiplayerReady = true;
                        await multiplayerChannel.track({
                            name: visitorName,
                            x: currentVisitorPosition().x,
                            y: currentVisitorPosition().y,
                            z: currentVisitorPosition().z,
                            rotation: currentVisitorPosition().rotation,
                            isMobile: currentVisitorPosition().isMobile,
                            joinedAt: new Date().toISOString()
                        });
                    }
                });

            window.addEventListener('beforeunload', () => {
                if (multiplayerChannel) supabaseClient.removeChannel(multiplayerChannel);
            });
        }

            function createCotopaxi() {
                // Faceted stratovolcano, with a broad base, steep upper cone and snowy summit.
                const rings = [[30,-7.49],[24,0],[18,10],[12,22],[8,34],[5,43],[3,47],[1.25,45.5]];
                const segments = 18, positions = [], colors = [];
                const palette = [0x75604b,0x8b7358,0x9b8a72,0xb8b6ad,0xe7e8e5,0xffffff]
                    .map(c => new THREE.Color(c));
                const vertices = rings.map(([radius,height],ri) =>
                    Array.from({length:segments},(_,j) => {
                        const a=j/segments*Math.PI*2;
                        const wobble=ri===0?1:1+0.035*Math.sin(j*2.17+ri*1.4);
                        return [COTOPAXI_X+Math.cos(a)*radius*wobble,
                            height+(ri>1?0.55*Math.sin(j*1.73+ri):0),
                            COTOPAXI_Z+Math.sin(a)*radius*wobble];
                    })
                );
                const tri=(a,b,c,col)=>[a,b,c].forEach(v=>{
                    positions.push(...v); colors.push(col.r,col.g,col.b);
                });
                for(let r=0;r<vertices.length-1;r++) for(let j=0;j<segments;j++){
                    const n=(j+1)%segments, a=vertices[r][j], b=vertices[r][n],
                        c=vertices[r+1][j], d=vertices[r+1][n];
                    const band=r<=1?(j%4===0?1:0):r<=3?(j%3===0?2:1):(j%4===0?3:4);
                    tri(a,b,c,palette[band]); tri(b,d,c,palette[band]);
                }
                const summit=[COTOPAXI_X,42,COTOPAXI_Z], top=vertices[vertices.length-1];
                for(let j=0;j<segments;j++) tri(top[j],top[(j+1)%segments],summit,palette[j%5===0?3:4]);

                const geo=new THREE.BufferGeometry();
                geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
                geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
                geo.computeVertexNormals();
                scene.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({
                    vertexColors:true,side:THREE.DoubleSide,flatShading:true
                })));

                // A dark summit crater and angular white glacier facets.

                crater.position.set(COTOPAXI_X,43.2,COTOPAXI_Z); scene.add(crater);
                const snowMat=new THREE.MeshBasicMaterial({color:0xf3f4f1,side:THREE.DoubleSide});
                for(let j=0;j<6;j++){

                    snow.position.set(COTOPAXI_X+Math.cos(a)*8.5,34.5,COTOPAXI_Z+Math.sin(a)*8.5);
                    snow.rotation.set(Math.sin(a)*0.42, a, Math.cos(a)*0.42);
                    scene.add(snow);
                }
            }

    // Function to update audio for both video screens
function updateAudio() {
    const viewerPosition = controls ? controls.getObject().position : camera.position;
    const distance1 = viewerPosition.distanceTo(videoScreen.position);
    const distance2 = viewerPosition.distanceTo(videoScreen2.position);
    const maxDistance = 10; // Maximum distance where audio is still audible
    const minDistance = 2; // Distance where volume is at max

    let volume = 0;
    let volume2 = 0;
    let instructionsVisible = false;
    let instructions2Visible = false;

    // Calculate volume and visibility for the first video
    if (distance1 < maxDistance) {
        instructionsVisible = true;
        volume += 1 - (distance1 - minDistance) / (maxDistance - minDistance);
    }

    // Calculate volume and visibility for the second video
    if (distance2 < maxDistance) {
        instructions2Visible = true;
        volume2 += 1 - (distance2 - minDistance) / (maxDistance - minDistance);
    }

    // Display instructions if the viewer is near either video
    if (instructionsVisible) {
        instructions.style.display = "block";
    } else {
        instructions.style.display = "none";
    }

    if (instructions2Visible) {
        instructions2.style.display = "block";
    } else {
        instructions2.style.display = "none";
    }

    // Show the R/M touch buttons only on mobile, and only within the
    // same 10-unit proximity range used by the nearby-video instructions.
    const isMobileDevice = window.matchMedia('(max-width: 1024px), (pointer: coarse)').matches;
    const videoControls = document.getElementById('videoControls');
    videoControls.style.display = (isMobileDevice && (instructionsVisible || instructions2Visible)) ? 'flex' : 'none';

    // Update the video volume for both screens
    video2.volume = Math.max(0, Math.min(1, volume2)); // Keep volume between 0 and 1
    video.volume = Math.max(0, Math.min(1, volume)); // Keep volume between 0 and 1
}

// Event listener for controlling video playback (mute/unmute, restart)
document.addEventListener("keydown", (event) => {
    if (instructions.style.display === "block") {
        if (event.code === "KeyR") {
            video.currentTime = 0; // Restart video
            video.muted = false;
            video.play();
            updateMuteButton();
        } else if (event.code === "KeyM") {
            video.muted = !video.muted;
            updateMuteButton();
        }
    }
});

document.addEventListener("keydown", (event) => {
    if (instructions2.style.display === "block") {
        if (event.code === "KeyR") {
            video2.currentTime = 0; // Restart video

            video2.play();
            updateMuteButton();
        } else if (event.code === "KeyM") {
            video2.muted = !video2.muted;
            updateMuteButton();
        }
    }
});

// Update proximity/audio 10 times per second rather than every animation frame.
// The videos and 3D scene continue rendering at full frame rate.
updateAudio();
const audioUpdateInterval = setInterval(updateAudio, 100);
}





            addFloorGrid(); // Continuous floor grid across both halls and surrounding space.
            createCotopaxi(); // Landmark behind the original spawn.\n            createRoom(0);  // First room
            createRoom2(100); // Second room, offset by 100 units

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (isMobile) renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            });

            document.addEventListener('keydown', (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'ArrowUp': if (!isMobile) { moveUp = true; event.preventDefault(); } break;
                    case 'ArrowDown': if (!isMobile) { moveDown = true; event.preventDefault(); } break;
                }
            });

            document.addEventListener('keyup', (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'ArrowUp': moveUp = false; break;
                    case 'ArrowDown': moveDown = false; break;
                }
            });

            setupMultiplayer();
            setupVoiceChat();
        }

        function animate() {
            requestAnimationFrame(animate);
            const frameTime = performance.now();
            const deltaSeconds = Math.min(0.05, (frameTime - (animate.lastFrameTime || frameTime)) / 1000);
            animate.lastFrameTime = frameTime;
            animateRemoteVisitors(deltaSeconds);
            if (welcomeVideoTexture) updateWelcomeSprite(frameTime);
            broadcastVisitorPosition(frameTime);
            const localPlayer = getLocalPlayerPosition();
            const localStartX = localPlayer.x;
            const localStartZ = localPlayer.z;
            if (controls && controls.isLocked) {
                const speed = 0.2;
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();
                velocity.z = direction.z * speed;
                velocity.x = direction.x * speed;
                controls.moveRight(velocity.x);
                controls.moveForward(velocity.z);
                controls.getObject().position.y += (Number(moveUp) - Number(moveDown)) * speed;
                // Keep the camera at or above the standing eye height when the avatar's feet touch the floor.
                controls.getObject().position.y = Math.max(2.5, controls.getObject().position.y);
            } else if (isMobile) {
                // Same joystick direction math as the other 3D room.
                const angle = camera.rotation.y;
                const forwardX = Math.sin(angle);
                const forwardZ = Math.cos(angle);
                const rightX = Math.cos(angle);
                const rightZ = -Math.sin(angle);
                const deltaX = (-moveZ * forwardX) + (moveX * rightX);
                const deltaZ = (-moveZ * forwardZ) + (moveX * rightZ);
                camera.position.x += deltaX * mobileMoveSpeed;
                camera.position.z += deltaZ * mobileMoveSpeed;

                camera.position.y += (Number(moveUp) - Number(moveDown)) * mobileMoveSpeed;
                // Same floor/standing-height limit as desktop.
                camera.position.y = Math.max(2.5, camera.position.y);
            }

            // Follow the volcano's surface: the player climbs its slope instead of crossing its mesh.
            keepPlayerOnCotopaxi();

            const movedDistance = Math.hypot(localPlayer.x - localStartX, localPlayer.z - localStartZ);
            if (movedDistance > 0.0015 && frameTime >= nextLocalFootstepAt) {
                playFootstep(0.13, 1.0);
                nextLocalFootstepAt = frameTime + 460;
            }
            renderer.render(scene, camera);
        }
    </script>
